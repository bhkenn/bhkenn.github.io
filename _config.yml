about_content: | # this will include new lines to allow paragraphs
 I'm Braxton Kenney, an aspiring software engineer and May 2026 graduate of West Virginia University. 
 My experience spans full-stack development, cybersecurity, and applied AI, most recently as a Software Engineering Intern at Noblis. 
 I've also worked in cyber attack and defense through an AF Institute of Technology program, and previously led a full website redesign as Webmaster for the West Virginia High School Soccer Coaches Association.
 
 Alongside my technical career, I serve in the West Virginia Army National Guard as an 
 Aeromedical Evacuations Officer. I will soon be attending the Army Medical Basic Officer Leadership Course, and following that Army Flight School.

