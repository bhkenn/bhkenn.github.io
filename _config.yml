      - layout: left
        title: WVU Army Reserve Officer Training Corps
        sub_title: Platoon Training Officer
        caption: August 2022 - present
        sub_title:  
        link: https://www.facebook.com/WVUArmyROTC/
        quote: >
          
        description: | 
           I have been a member of Army ROTC at WVU for 3 years now, and I have learned extremely valuable skills. 
           Through a military science class, morning physical fitness, weekly leadership labs, and semesterly field training exercises, I have gained a huge amount of leadership experience. 
           For the fall 2024 semester I was selected as the command sergeant major for the battalion. 
           In this position I worked closely with the battalion commander, and was responsible for the supervision of all battalion leadership and cadets (~150 people). 
           I also was responsible for assisting with planning battalion events, including taking charge on all battalion ruck march planning and execution.
           For the Fall 2025 semester, I am serving as Alpha Company Commander. This means I am leading the development of the newest class of freshman (~60 people) into future Army Officers. 
           I am responsible for planning all leadership labs and special events for the company, as well as coordinating personnel at all levels.

