  - title: Experience
    layout: list
    content:
      - layout: left
        title: West Virginia Army National Guard
        sub_title: Aeromedical Evacuations Officer
        caption: June 2023 - present
        quote: >
         
        description: | 
          As a second lieutenant in the Army National Guard, I am awaiting attendance at the Basic Officer Leader Course while actively contributing to my unit in the meantime. 
          In this role, I teach classes and assist with personnel management within the unit. 
          I am also enrolled in Basic Aviator Training School (BATS), where I receive coursework and preparatory training designed to ready me for Army flight school.

      - layout: left
        title: Noblis
        sub_title: Software Engineering Intern
        caption: June 2026 - August 2026
        quote: >
          
        description: |
           As a Software Engineering Intern at Noblis, I worked on a team responsible for a monitoring software and hardware solution, focusing specifically on the web application component of the solution, an Angular front end backed by a Java REST API. 
           Working alongside another intern, I helped design and build a new feature for the app: a RAG (Retrieval-Augmented Generation) system that allows users to upload documents and generate summaries of system faults based on the content provided. 
           I contributed across the full stack, from the Angular front end and Java REST API (including JDBC integration and endpoint development) to prompt engineering, UI design, and testing with JUnit and Robot Framework. 
           I collaborated with the team in daily stand-up meetings to help prioritize tasks and monitor progress on objectives.

      - layout: left
        title: Immersive Cyber Education
        sub_title: Internship
        caption: July 2025 - August 2025
        quote: >
          
        description: |
           This is a program hosted by the AF Institute of Technology faculty, and covers a wide range of topics including networking, industrial control systems, digital forensics, cryptography, cyber attack & defense, firmware analysis, and software reverse engineering. 
           The program ended with a week long "Hackathon," which had teams set up a network with multiple hosts and services, and then compete with each other to keep these services up, capture other services on the public network, complete challenges, and locate flags.
           
      - layout: left
        title: West Virginia High School Soccer Coaches Association
        sub_title: Webmaster
        caption: February 2024 - February 2025
        quote: >
          
        description: | 
           In my position of Webmaster for the WVHSSCA, I was responsible for the development and maintenance of the association's website. 
           This site receives traffic from high soccer coaches and players across the state of West Virginia. 
           I worked closely with my professor, who is a WVHSSCA officer, to implement the wants and needs of the association.
           Although it was never deployed due to the association focusing on other issues, a finished site was delivered that met all requirements.

      - layout: left
        title: Elkins Randolph County YMCA
        sub_title: Lifeguard
        caption: September 2021 - August 2022
        quote: >
         
        description: | 
          As a lifeguard at the Randolph County YMCA I was responsible for the safety of patrons using the pool facilities, as well as maintaining said facilities to ensure satisfaction with the patrons.

      - layout: left
        title: Vintage Restaurant and Wine Bar
        sub_title: Host
        caption: July 2019 - April 2021
        quote: >
         
        description: | 
          In my position as a host for the Vintage Restaurant and Wine Bar I completed many different tasks to ensure smooth operation of the restaurant. 
          These tasks included fulfilling take-out orders, seating customers, setting tables, cleaning facilities, and anything else needed by the wait staff and management.

  - title: Organizations
    layout: list
